name: Build docker images

on:
  workflow_dispatch:
  # Nightly больше не пушит те же теги поверх. Пересборка — только при
  # изменении пакета или ручном запуске. Security-bump делается отдельным PR.
  push:
    branches:
      - master
    paths:
      - packages/alpine-node-nginx/**
      - .github/workflows/alpine-node.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { node: '22.22.0', alpine: '3.23', image: node, dockerfile: Dockerfile, tag: '22.22.0' },
            { node: '24.14.1', alpine: '3.23', image: node, dockerfile: Dockerfile, tag: '24.14.1' },
            { node: '26.7.0', alpine: '3.24', image: node, dockerfile: Dockerfile, tag: '26.7.0' },
            { node: '22.22.0', alpine: '3.23', image: node, dockerfile: Dockerfile-slim, tag: '22.22.0-slim' },
            { node: '24.14.1', alpine: '3.23', image: node, dockerfile: Dockerfile-slim, tag: '24.14.1-slim' },
            { node: '26.7.0', alpine: '3.24', image: node, dockerfile: Dockerfile-slim, tag: '26.7.0-slim' },
          ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get git short SHA
        id: git_info
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "is_master=${{ github.ref_name == 'master' }}" >> "$GITHUB_OUTPUT"

      - name: Determine tags
        id: tag_info
        run: |
          floating="${{ matrix.versions.tag }}"
          immutable="${floating}-${{ steps.git_info.outputs.short_sha }}"
          echo "immutable_tag=${immutable}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.git_info.outputs.is_master }}" = "true" ]; then
            echo "tags=alfabankui/arui-scripts:${floating},alfabankui/arui-scripts:${immutable}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=alfabankui/arui-scripts:${immutable}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: packages/alpine-node-nginx/
          file: packages/alpine-node-nginx/${{ matrix.versions.dockerfile }}
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.versions.node }}
            ALPINE_VERSION=${{ matrix.versions.alpine }}
            NODE_BASE_IMAGE=${{ matrix.versions.image }}
          tags: ${{ steps.tag_info.outputs.tags }}
          # scope по dockerfile+alpine: три Node-версии Slim/3.23 делят кэш
          # стадии nginx-builder.
          cache-from: type=gha,scope=${{ matrix.versions.dockerfile }}-${{ matrix.versions.alpine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.versions.dockerfile }}-${{ matrix.versions.alpine }}
